<div class="d-flex flex-column flex-md-row align-items-center justify-content-between p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm fixed-top">
  <div class="d-flex align-center">
      <img src="images/logo.png" style="max-height: 70px;" alt="myview" class="logo" routerLink="/" />
      <h5 class="my-0 ml-md-2 font-weight-normal"></h5>
  </div>

    <nav class="my-2 my-md-0 mr-md-3 text-uppercase" style="font-size: larger;">
      <a class="p-2" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a class="p-2" routerLink="/store" routerLinkActive="active">Store</a>
      <a class="p-2" >GitHub</a>
      <a class="p-2" >Facebook</a>

    </nav>
    <div class="d-flex align-center">  
      <a [routerLink]="['/basket']" class="position-relative">
        <i class="fa fa-shopping-cart fa-2x me-4 text-dark"></i>
        <div *ngIf="(basketService.basketSource$ | async) as basket" class="cart-no">{{ getBasketCount(basket.items) }}</div>
      </a>
      <a *ngIf="!isUserAuthenticated" (click)="login()" class="btn btn-link" style="color: gray;">Login</a>
      <a *ngIf="isUserAuthenticated" (click)="logout()" class="btn btn-link" style="color: gray;">Logout</a>
      <!-- <a *ngIf="isUserAuthenticated" class="btn btn-link" style="color: rgb(194, 3, 3);">{{ userName }}</a>       -->

       <div class="dropdown">
        <button *ngIf="isUserAuthenticated" class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          {{ userName }}
        </button>
        <ul class="dropdown-menu">
          <li><a *ngIf="isUserAuthenticated" (click)="logout()" class="dropdown-item" href="#">Logout</a></li>
          <li><a class="dropdown-item" href="#">Another action</a></li>
          <li><a class="dropdown-item" href="#">Something else here</a></li>
        </ul>
      </div>
    </div>
