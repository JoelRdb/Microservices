<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=1024, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Silent-Callback</title>
        <script src="../node_modules/oidc-client/lib/oidc-client.min.js"></script>
    </head>
    <body>
        <script>
            const idpSettings = {
                authority: "https://localhost:9009", // URL du serveur d'authentification (Identity Provider)
                clientId: "angular-client", // Identifiant du client enregistré
                scope: "openid profile ecommercegateway", // Scopes demandés
                response_type: "code" // Flux d’autorisation : Authorization Code Flow
            };

            new Oidc.UserManager(idpSettings).signinSilentCallback()
                .catch(error => {
                    console.log(error);
                });
        </script>
    </body>
</html>
