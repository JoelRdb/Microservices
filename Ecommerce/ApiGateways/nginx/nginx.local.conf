worker_processes 1;
events { worker_connections 1024; }

http {
	sendfile on;
	large_client_header_buffers 4 32k;

	upstream identity {
		server identityserver:9011;
	}

	upstream catalog {
		server catalog.api:8080;
	}

	upstream basket {
		server basket.api:8080;
	}

	upstream discount {
		server discount.api:8080;
	}

	upstream ordering {
		server ordering.api:8080;
	}

	
	server {
        listen 44344 ssl;
        ssl_certificate /etc/ssl/certs/id-local.eshopping.com.crt;
        ssl_certificate_key /etc/ssl/private/id-local.eshopping.com.key;
        server_name $hostname;

        # Ce bloc gère TOUTES les requêtes d'authentification et de découverte OIDC.
        location ~* /(.well-known/|connect/|account/|css/|js/|lib/|images/|/img) {
			proxy_pass				http://identity;
			proxy_redirect			off;
			proxy_http_version		1.1;
			proxy_cache_bypass		$http_upgrade;
			proxy_set_header		Upgrade $http_upgrade;
			proxy_set_header		Connection "keep-alive";
			proxy_set_header		Host $host:44344;
			proxy_set_header		X-Real-IP $remote_addr;
			proxy_set_header		X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header		X-Forwarded-Proto $scheme;
			proxy_set_header		X-Forwarded-Host $server_name;
			proxy_buffer_size				128k;
			proxy_buffers					4 256k;
			proxy_busy_buffers_size			256k;
        }

        # Ce bloc, qui est le plus générique, gère le trafic d'API et le renvoie vers Ocelot.
        # Il doit être placé en dernier.
        location / {
            proxy_pass http://ocelotapigw:8080;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "keep-alive";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


}